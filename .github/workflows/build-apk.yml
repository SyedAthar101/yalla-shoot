name: Build Yalla Shoot APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      # The repo snapshot is text-only (no binary PNGs / wrapper jar),
      # so regenerate them here before the build.
      - name: Restore Gradle wrapper jar
        run: |
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar
          ls -lh android/gradle/wrapper/gradle-wrapper.jar
      - name: Generate launcher icons
        run: |
          pip install --quiet pillow
          python3 tools/make_icons.py
          ls android/app/src/main/res/mipmap-*/ic_launcher.png
      - run: flutter pub get
      - run: flutter analyze
        continue-on-error: true
      - run: chmod +x android/gradlew
      - run: flutter build apk --release
      # Publish the APK as a public GitHub Release so it can be
      # downloaded directly without any sign-in (no more artifact dance).
      - name: Read version from pubspec
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/YallaShoot-v$VER-release.apk"
          ls -lh build/app/outputs/flutter-apk/
      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Yalla Shoot v${{ steps.version.outputs.version }}
          files: build/app/outputs/flutter-apk/YallaShoot-v*.apk
          body: "Yalla Shoot Android APK (sideload). Install karke purani version replace kar dein."
      - uses: actions/upload-artifact@v4
        with:
          name: YallaShoot-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
