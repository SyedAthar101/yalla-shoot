name: yalla_shoot
description: "Yalla Shoot - يلا شوت | مباريات اليوم بث مباشر - official app. The site base URL is resolved at startup from a remote config (app_config.json in the GitHub repo) and cached, so site domain changes no longer require an app update."
publish_to: 'none'
version: 1.3.0+7

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.4
  webview_flutter: ^4.10.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
